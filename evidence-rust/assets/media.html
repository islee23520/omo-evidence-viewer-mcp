<section class="viewer" aria-label="@@TITLE@@ 미디어 탐색"><div class="viewer-bar"><button type="button" id="previous" aria-label="이전 항목">← 이전</button><span id="position" aria-live="polite"></span><button type="button" id="next" aria-label="다음 항목">다음 →</button></div><div id="media"></div><p class="viewer-name"><a id="original" target="_blank" rel="noopener">원본 열기</a></p></section><style>.viewer{margin:24px 0 36px;background:#16141c;color:#f5f3f9;border-radius:12px;padding:16px}.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.viewer-bar span{color:#d7d1e1;text-align:center;overflow-wrap:anywhere}.viewer button{font:inherit;color:inherit;background:#35303e;border:1px solid #625a73;border-radius:8px;padding:8px 14px;cursor:pointer}.viewer button:hover:not(:disabled){background:#514763}.viewer button:disabled{opacity:.45;cursor:default}.viewer button:focus-visible,.viewer a:focus-visible{outline:2px solid #d0baff;outline-offset:3px}.viewer #media{display:grid;place-items:center;min-height:200px}.viewer img,.viewer video,.viewer iframe{display:block;max-width:100%;max-height:75vh;border:0}.viewer video{width:100%}.viewer iframe{width:100%;height:75vh;background:white}.viewer-name{margin:12px 0 0;overflow-wrap:anywhere}.viewer-name a{color:#d0baff}@media(max-width:600px){.viewer{padding:12px}.viewer button{padding:8px}}
  </style><script>(()=>{const items=@@MEDIA@@;const media=document.getElementById("media");const position=document.getElementById("position");const previous=document.getElementById("previous");const next=document.getElementById("next");const original=document.getElementById("original");let index=Number(new URL(location.href).searchParams.get("page"))-1;if(!Number.isInteger(index)||index<0||index>=items.length)index=0;function show(i,record=true){index=i;const item=items[i];const element=document.createElement(item.kind==="image"?"img":item.kind==="video"?"video":"iframe");element.src=item.href;if(item.kind==="image")element.alt=item.name;if(item.kind==="video")element.controls=true;if(item.kind==="pdf")element.title=item.name;media.replaceChildren(element);position.textContent=(i+1)+" / "+items.length+" · "+item.name;original.href=item.href;previous.disabled=i===0;next.disabled=i===items.length-1;if(record){const url=new URL(location.href);url.searchParams.set("page",i+1);history.pushState({page:i+1},"",url)}if(items[i+1]?.kind==="image"){const preload=new Image();preload.src=items[i+1].href}}previous.onclick=()=>{if(index>0)show(index-1)};next.onclick=()=>{if(index<items.length-1)show(index+1)};document.addEventListener("keydown",event=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;if(event.key==="ArrowLeft"&&index>0)show(index-1);if(event.key==="ArrowRight"&&index<items.length-1)show(index+1)});addEventListener("popstate",()=>{const page=Number(new URL(location.href).searchParams.get("page"))-1;show(Number.isInteger(page)&&page>=0&&page<items.length?page:0,false)});show(index,false)})()</script>
