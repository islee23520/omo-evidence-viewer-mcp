[package]
name = "omo-evidence-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Native immutable Evidence content storage"
license = "MIT"
repository = "https://github.com/islee23520/omo-evidence-viewer-mcp"

[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
futures-util = "0.3"
base64 = "0.22.1"
hmac = "0.12.1"
percent-encoding = "2"
regex = "1.12"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10.9"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "fs", "process"] }
url = "=2.5.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
